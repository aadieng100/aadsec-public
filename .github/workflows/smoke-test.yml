name: smoke-test

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release qui contient les assets (ex. v0.1.0, v0.1.1-rc.1)"
        required: true
        default: "v0.1.0"
      version:
        description: "Version du CLI (ex. 0.1.0, 0.1.1)"
        required: true
        default: "0.1.0"
      image_ref:
        description: "Reference de l'image runner"
        required: true
        default: "ghcr.io/aadieng100/aadsec-runner:0.1.0"
      run_aplus:
        description: "Job A+ : hote arm64 avec emulation amd64"
        type: boolean
        default: false
      run_macos:
        description: "Job macOS arm64 : install.sh et aadsec --version, sans Docker"
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  VERSION: ${{ inputs.version }}
  IMAGE_REF: ${{ inputs.image_ref }}
  DEMO_REPO: aadieng100/aadsec-demo-vulnerable
  DEMO_COMMIT: fa975d76b0b54fcb2c78c171f26d626d8f6084fe

jobs:
  native:
    name: native-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            elf_machine: "3e00"
          - os: ubuntu-24.04-arm
            arch: arm64
            elf_machine: "b700"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "$RELEASE_TAG" --repo aadieng100/aadsec-public --dir assets

      - name: Verify SHA256SUMS
        run: |
          cd assets
          sha256sum -c SHA256SUMS

      - name: Install AADSec CLI
        run: |
          cd assets
          export AADSEC_VERSION="$VERSION"
          export AADSEC_BASE_URL="$GITHUB_SERVER_URL/aadieng100/aadsec-public/releases/download/$RELEASE_TAG"
          bash install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aadsec" --version

      - name: Pull runner image
        run: |
          docker pull "$IMAGE_REF"

      - name: Check binary architecture in the image
        env:
          EXPECTED: ${{ matrix.elf_machine }}
        run: |
          mkdir -p elf
          cid="$(docker create "$IMAGE_REF")"
          failed=0
          for f in aadsec-runner gitleaks trivy; do
            docker cp "$cid:/usr/local/bin/$f" "elf/$f"
            m="$(od -An -tx1 -j18 -N2 "elf/$f" | tr -d ' \n')"
            echo "$f e_machine=$m expected=$EXPECTED"
            if [ "$m" != "$EXPECTED" ]; then failed=1; fi
          done
          docker rm "$cid" > /dev/null
          if [ "$failed" -ne 0 ]; then echo "Architecture mismatch in image"; exit 1; fi

      - name: Clone vulnerable demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "$DEMO_REPO" aadsec-demo-vulnerable
          cd aadsec-demo-vulnerable
          git checkout "$DEMO_COMMIT"
          test "$(git rev-parse HEAD)" = "$DEMO_COMMIT"

      - name: Run AADSec scan
        env:
          AADSEC_RUNNER_IMAGE: ${{ inputs.image_ref }}
        run: |
          export AADSEC_STATE_DIR="$(mktemp -d)"
          aadsec scan --offline --out security-output aadsec-demo-vulnerable

      - name: Compare metrics
        run: |
          python3 .github/scripts/compare_metrics.py

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        if: always()
        with:
          name: smoke-test-artifacts-${{ matrix.arch }}
          path: |
            security-output/findings.json
            security-output/audit-metadata.json
          if-no-files-found: error

  aplus:
    name: aplus-arm64-host-amd64-emulation
    if: ${{ inputs.run_aplus }}
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64

      - name: Verify amd64 emulation
        run: |
          docker run --rm --platform linux/amd64 alpine:3.24.2 uname -m

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "$RELEASE_TAG" --repo aadieng100/aadsec-public --dir assets

      - name: Verify SHA256SUMS
        run: |
          cd assets
          sha256sum -c SHA256SUMS

      - name: Install AADSec CLI
        run: |
          cd assets
          export AADSEC_VERSION="$VERSION"
          export AADSEC_BASE_URL="$GITHUB_SERVER_URL/aadieng100/aadsec-public/releases/download/$RELEASE_TAG"
          bash install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aadsec" --version
          uname -m

      - name: Pull runner image (amd64 variant)
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          docker pull "$IMAGE_REF"
          docker image inspect "$IMAGE_REF" --format '{{.Os}}/{{.Architecture}}'

      - name: Clone vulnerable demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "$DEMO_REPO" aadsec-demo-vulnerable
          cd aadsec-demo-vulnerable
          git checkout "$DEMO_COMMIT"
          test "$(git rev-parse HEAD)" = "$DEMO_COMMIT"

      - name: Run AADSec scan under amd64 emulation
        env:
          AADSEC_RUNNER_IMAGE: ${{ inputs.image_ref }}
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          export AADSEC_STATE_DIR="$(mktemp -d)"
          aadsec scan --offline --out security-output aadsec-demo-vulnerable

      - name: Compare metrics
        run: |
          python3 .github/scripts/compare_metrics.py

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        if: always()
        with:
          name: smoke-test-artifacts-aplus
          path: |
            security-output/findings.json
            security-output/audit-metadata.json
          if-no-files-found: error

  macos:
    name: macos-arm64-cli-only
    if: ${{ inputs.run_macos }}
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "$RELEASE_TAG" --repo aadieng100/aadsec-public --dir assets

      - name: Verify SHA256SUMS
        run: |
          cd assets
          shasum -a 256 -c SHA256SUMS

      - name: Install AADSec CLI and print version
        run: |
          cd assets
          export AADSEC_VERSION="$VERSION"
          export AADSEC_BASE_URL="$GITHUB_SERVER_URL/aadieng100/aadsec-public/releases/download/$RELEASE_TAG"
          bash install.sh
          uname -m
          "$HOME/.local/bin/aadsec" --version